<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>管理控制台 · 英语听读系统</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171d2b; --panel-2: #1e2536; --line: #2a3245;
    --text: #e8ecf4; --muted: #8b93a7; --brand: #4f8cff; --good: #2fbf71; --bad: #e5484d; --warn: #f5a524;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; padding: 28px 20px 60px; }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .notice { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); background: color-mix(in srgb, var(--warn) 10%, var(--panel)); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 12.5px; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  td.num { font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .btn { border: 1px solid var(--line); background: var(--panel-2); color: var(--text); border-radius: 8px; padding: 5px 12px; font-size: 12.5px; cursor: pointer; }
  .btn:hover { border-color: var(--brand); }
  .btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
  .btn.danger:hover { background: color-mix(in srgb, var(--bad) 18%, var(--panel-2)); }
  .btn.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
  .acts { display: flex; gap: 6px; white-space: nowrap; }
  .empty { color: var(--muted); padding: 18px 4px; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .toolbar .btn { font-size: 13px; padding: 7px 14px; }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); padding: 20px; min-width: 320px; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog h3 { margin: 0 0 12px; font-size: 15px; }
  dialog label { display: block; color: var(--muted); font-size: 12.5px; margin: 10px 0 4px; }
  dialog input { width: 100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .err { color: var(--bad); font-size: 12.5px; min-height: 18px; margin-top: 8px; }
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line); color: var(--text); padding: 9px 18px; border-radius: 99px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛠 管理控制台</h1>
  <div class="sub">账号与数据管理 · 仅限本机访问（127.0.0.1）</div>

  <div class="card notice">⚠️ 删除账号会<b>同时清除</b>该账号的全部练习记录、错词统计与单词本，且不可恢复；建议先让用户在「设置 → 导出完整备份」。</div>

  <div class="card">
    <div class="toolbar">
      <strong>账号列表</strong>
      <button class="btn" id="reload">⟳ 刷新</button>
    </div>
    <div id="list"><div class="empty">加载中…</div></div>
  </div>
</div>

<dialog id="dlg">
  <h3 id="dlgTitle">重置密码</h3>
  <label id="dlgUser"></label>
  <input id="dlgPass" type="text" placeholder="新密码（至少 6 位）" maxlength="64" />
  <div class="err" id="dlgErr"></div>
  <div class="row">
    <button class="btn" id="dlgCancel">取消</button>
    <button class="btn ok" id="dlgOk">确认重置</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
  const $ = (s) => document.querySelector(s);
  let accounts = [];
  let resetTarget = null;

  const TOKEN_KEY = 'amread.adminToken';
  const getToken = () => localStorage.getItem(TOKEN_KEY) || '';
  const setToken = (t) => localStorage.setItem(TOKEN_KEY, t);

  const jf = async (url, opts = {}) => {
    const r = await fetch(url, { headers: { 'Content-Type': 'application/json', 'X-Admin-Token': getToken() }, ...opts });
    const data = await r.json().catch(() => ({}));
    if (r.status === 403) throw Object.assign(new Error('管理令牌缺失或不正确'), { needToken: true });
    if (!r.ok || data.ok === false) throw new Error(data.error || `HTTP ${r.status}`);
    return data;
  };

  const askToken = () => {
    const t = prompt('请输入管理令牌（ADMIN_TOKEN，见 docker-compose.yml）\n\n本地直跑未设令牌时可留空：', getToken());
    if (t !== null) setToken(t.trim());
    return t !== null;
  };

  const withToken = async (fn) => {
    for (let i = 0; i < 3; i += 1) {
      try { return await fn(); } catch (e) {
        if (e.needToken && i < 2 && askToken()) continue;
        throw e;
      }
    }
  };

  const toast = (msg) => { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); };
  const fmt = (ts) => (ts ? new Date(ts).toLocaleString('zh-CN', { hour12: false }) : '—');

  async function load() {
    $('#list').innerHTML = '<div class="empty">加载中…</div>';
    try {
      accounts = (await withToken(() => jf('/api/admin/accounts'))).accounts || [];
      if (!accounts.length) { $('#list').innerHTML = '<div class="empty">还没有任何注册账号。</div>'; return; }
      $('#list').innerHTML = `<table>
        <thead><tr><th>ID</th><th>用户名</th><th>注册时间</th><th>最近活跃</th><th class="num">练习</th><th class="num">错词</th><th class="num">单词本</th><th>操作</th></tr></thead>
        <tbody>${accounts.map((a) => `<tr>
          <td class="num">${a.id}</td>
          <td><b>${escapeHtml(a.username)}</b> <span class="tag">${a.uid}</span></td>
          <td>${fmt(a.createdAt)}</td>
          <td>${fmt(a.lastActive)}</td>
          <td class="num">${a.records}</td>
          <td class="num">${a.words}</td>
          <td class="num">${a.wordbook}</td>
          <td><div class="acts">
            <button class="btn" data-reset="${a.id}" data-name="${escapeHtml(a.username)}">重置密码</button>
            <button class="btn danger" data-del="${a.id}" data-name="${escapeHtml(a.username)}">删除</button>
          </div></td>
        </tr>`).join('')}</tbody></table>`;

      $('#list').querySelectorAll('[data-reset]').forEach((b) => { b.onclick = () => openReset(Number(b.dataset.reset), b.dataset.name); });
      $('#list').querySelectorAll('[data-del]').forEach((b) => { b.onclick = () => del(Number(b.dataset.del), b.dataset.name); });
    } catch (e) {
      $('#list').innerHTML = `<div class="empty">加载失败：${escapeHtml(e.message)}</div>`;
    }
  }

  function openReset(id, name) {
    resetTarget = id;
    $('#dlgTitle').textContent = '重置密码';
    $('#dlgUser').textContent = `账号：${name}（ID ${id}）`;
    $('#dlgPass').value = '';
    $('#dlgErr').textContent = '';
    $('#dlg').showModal();
    $('#dlgPass').focus();
  }

  $('#dlgCancel').onclick = () => $('#dlg').close();
  $('#dlgOk').onclick = async () => {
    try {
      await withToken(() => jf('/api/admin/account/resetpass', { method: 'POST', body: JSON.stringify({ id: resetTarget, password: $('#dlgPass').value }) }));
      $('#dlg').close();
      toast('密码已重置');
    } catch (e) { $('#dlgErr').textContent = e.message; }
  };
  $('#dlgPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#dlgOk').click(); });

  async function del(id, name) {
    if (!confirm(`确定删除账号「${name}」（ID ${id}）？\n\n该账号的全部练习记录、错词、单词本将被永久清除，不可恢复！`)) return;
    if (!confirm('再次确认：真的要删除吗？此操作不可撤销。')) return;
    try {
      await withToken(() => jf('/api/admin/account/delete', { method: 'POST', body: JSON.stringify({ id }) }));
      toast(`已删除 ${name}`);
      load();
    } catch (e) { toast(`删除失败：${e.message}`); }
  }

  $('#reload').onclick = load;
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  load();
</script>
</body>
</html>
